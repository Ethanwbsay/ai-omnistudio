name: question_solver
description: AI Omnistudio for roleplay chat, photo question solving, and image and video generation.
publish_to: none
version: 1.0.14+15

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.1.2
  file_picker: ^10.3.10
  image_picker: ^1.1.2
  image_cropper: ^12.2.1
  flutter_math_fork: ^0.7.4
  path_provider: ^2.1.5
  shared_preferences: ^2.3.2
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
